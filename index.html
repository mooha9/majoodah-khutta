:root{--ink:#0b3d40;--muted:#5b7476;--line:#d9e6e6;--paper:#f5f9f8;--card:#fff;--teal:#0a6d73;--teal-2:#16787c;--teal-soft:#e3f1f0;--must:#c9891f;--must-soft:#fbf1df;
 --ex:#1f8a4c;--pr:#2d6cc4;--la:#d98a1c;--re:#c4513f;--exs:#e4f4ea;--prs:#e6eefb;--las:#fbf1df;--res:#fbe9e7;
 --f-d:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;--r:14px}

:root[data-theme=dark]{--ink:#e4efee;--muted:#9db3b2;--line:#24393a;--paper:#0d1717;--card:#132222;--teal:#4fb7b5;--teal-2:#6cc9c6;--teal-soft:#16302f;--must:#e6ac4a;--must-soft:#2c2414;--exs:#132b1e;--prs:#14223a;--las:#2c2414;--res:#341b19;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.7}
.app{direction:rtl;max-width:1180px;margin:0 auto;padding:0 16px 60px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px;padding:12px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.mark{width:40px;height:40px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:12px}
.brand h1{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.on{border-color:var(--ex);color:var(--ex)}.btn.small{padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{background:var(--teal-soft);color:var(--teal);font-weight:600}
section.view{margin-top:20px}
.lead{color:var(--muted);margin:4px 0 14px;max-width:80ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 11px}
.note{font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;font-size:14px;vertical-align:middle}
table.t th{background:var(--teal-soft);color:var(--teal);font-size:12.5px;font-weight:600}
table.t tr:last-child td{border-bottom:0}
table.t input[type=number]{width:74px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:3px 6px;text-align:center}
tr.std td{background:var(--teal-soft);font-weight:600;color:var(--teal)}
tr.dom td{background:var(--teal);color:#fff;font-family:var(--f-d)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.lv{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.lv-4{background:var(--exs);color:var(--ex)}.lv-3{background:var(--prs);color:var(--pr)}.lv-2{background:var(--las);color:var(--la)}.lv-1{background:var(--res);color:var(--re)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12.5px}.kpi b{font-family:var(--f-d);font-size:24px}
.kpi.hero{background:var(--teal);border-color:var(--teal);color:#fff}.kpi.hero small{color:rgba(255,255,255,.85)}
.chart{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.two{grid-template-columns:1fr}}
.plan td{vertical-align:top}.plan textarea{width:100%;min-height:62px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;resize:vertical;font-size:13.5px}
.plan select{min-width:118px}
.plan input[type=text],.plan input[type=date],.plan select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px 6px;font-size:13px}
.scroll{overflow-x:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.panel form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.panel input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 12px;direction:ltr;text-align:left}
.msg{font-size:13.5px;margin-top:8px}.msg.ok{color:var(--ex)}.msg.err{color:var(--re)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}.toast.show{opacity:1}
.empty{color:var(--muted);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:var(--r)}
.print-only{display:none}
.btn.danger{color:var(--re)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--paper);padding:7px 22px;cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:600}
.sig-slots{display:flex;gap:14px;flex-wrap:wrap}
.sig-slot{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:8px;min-width:220px;flex:1}
.sig-prev{height:84px;border:1.5px dashed var(--line);border-radius:9px;background:#fff;display:grid;place-items:center;color:#8a9b99;font-size:12px;overflow:hidden}
.sig-prev img{max-height:100%;max-width:100%;object-fit:contain}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{background:var(--card);border-radius:14px;padding:16px;margin:0;max-width:680px;width:100%;display:flex;flex-direction:column;gap:12px;direction:rtl}
.modal canvas{width:100%;aspect-ratio:5/2;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair}
.pbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.pbar label{font-size:13px;color:var(--muted);font-weight:500}
.pbar select,.pbar input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 11px}
.pbar input{flex:1;min-width:200px}
@page{size:A4 landscape;margin:10mm}
@media print{
 body{background:#fff;color:#000;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .top,.view,.toast,.panel,.no-print{display:none!important}
 .print-only{display:block}
 .pp{page-break-after:always;direction:rtl;position:relative}.pp:last-child{page-break-after:auto}
 .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0a6d73;padding-bottom:5px;margin-bottom:8px}
 .ph img{height:38px}.ph h1{font-size:15px;color:#0a6d73;text-align:center;flex:1}
 table.p{width:100%;border-collapse:collapse}table.p th,table.p td{border:1px solid #c9d9d9;padding:3px 5px;font-size:9.2px;text-align:start;vertical-align:top}table.p th{background:#e3f1f0;color:#0a6d73}
 table.p tr{break-inside:avoid}
 .cover{height:160mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
 .cover h1{font-size:30px;color:#0a6d73}.cover .meta{font-size:12px;line-height:1.9;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;text-align:start}
 .wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:rgba(10,109,115,.09);transform:rotate(-25deg);font-family:var(--f-d);pointer-events:none}
 .sig{display:flex;justify-content:space-between;margin-top:18px;font-size:10.5px}.sig>div{width:28%;text-align:center}.sig .sg-l{display:block;border-top:1px solid #999;padding-top:5px}.sig .sg-im{display:flex;align-items:flex-end;justify-content:center;height:19mm;padding-bottom:1mm}.sig-img{max-height:18mm;max-width:100%;object-fit:contain}
 .kpis{grid-template-columns:repeat(5,1fr)}.kpi{border:1px solid #c9d9d9;padding:5px 8px}.kpi b{font-size:17px}
}
